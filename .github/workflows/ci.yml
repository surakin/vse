name: CI

# Builds the engine and runs every test of the plain flavor on Linux x86-64, Windows x64 (MSVC) and macOS arm64
# (Apple silicon, native). Sanitizer flavors and the window ("display") tests are not run here: the hosted runners
# have no GPU and no desktop session. Prerequisites per platform: BUILD.md. Plan: plans/maintenance/github-ci.md.

# Only a change to code, build files, shaders, assets or this workflow starts a run: documentation, plans and status
# files do not. A manual run (workflow_dispatch) always works.
on:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'game/**'
      - 'tools/**'
      - 'tests/**'
      - 'include/**'
      - 'shaders/**'
      - 'assets/**'
      - 'abi/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'scripts/test-phase.sh'
      - 'CURRENT_PHASE'
      - 'SIDE_PHASES'
      - 'UNICODE_VERSION'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'game/**'
      - 'tools/**'
      - 'tests/**'
      - 'include/**'
      - 'shaders/**'
      - 'assets/**'
      - 'abi/**'
      - 'cmake/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'scripts/test-phase.sh'
      - 'CURRENT_PHASE'
      - 'SIDE_PHASES'
      - 'UNICODE_VERSION'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86-64 (clang, plain)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install the build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config binutils elfutils gdb lldb \
            libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxfixes-dev \
            libvulkan-dev mesa-vulkan-drivers

      - name: Configure
        run: cmake --preset linux

      - name: Build and run every test
        run: scripts/test-phase.sh --all --no-display

      - name: Keep the test log of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  windows:
    name: Windows x64 (MSVC, plain)
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install the Vulkan SDK (its headers are needed to build)
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      # The action installs the SDK inside the checkout (VULKAN_SDK/); git must not see it as changed paths, or the
      # scripts' --affected tests (which ask git what changed) fail.
      - name: Keep the SDK out of git's view
        shell: bash
        run: echo "VULKAN_SDK/" >> .git/info/exclude

      - name: Make sure Ninja is there
        shell: bash
        run: ninja --version || choco install ninja -y

      # A plain shell, never a Developer Command Prompt: the toolchain file finds MSVC and the SDK itself.
      - name: Configure
        shell: bash
        run: cmake --preset windows-msvc

      - name: Build and run every test
        shell: bash
        run: scripts/test-phase.sh --all --no-display

      # engine_c_acceptance_scene ends in a segmentation fault on the runner's software adapter and the test has no crash handler:
      # run it again under the debugger and print the stack at the fault (KNOWN-ISSUES.md). Remove this step with the fault.
      - name: Stack of the acceptance scene fault
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $cdb = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64" -Filter cdb.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $exe = Get-ChildItem -Path build-msvc -Recurse -Filter host_acceptance_scene.exe | Select-Object -First 1
          if (-not $cdb) { Write-Host "no cdb on this image"; exit 0 }
          if (-not $exe) { Write-Host "no host_acceptance_scene.exe"; exit 0 }
          Write-Host "cdb: $($cdb.FullName)"
          Write-Host "exe: $($exe.FullName)"
          & $cdb.FullName -g -G -c "k 40; q" $exe.FullName 2>&1 | Select-Object -Last 120

      - name: Keep the test log of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: build-msvc/Testing/Temporary/
          if-no-files-found: ignore

  macos:
    name: macOS arm64 (Apple clang, plain)
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Make sure CMake and Ninja are there
        run: |
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja

      - name: Configure
        run: cmake --preset macos-clang-arm64

      - name: Build and run every test
        run: scripts/test-phase.sh --all --no-display

      - name: Keep the test log of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-logs
          path: build-macos-arm64/Testing/Temporary/
          if-no-files-found: ignore
